# Builds Bill's Billables (Android) whenever it changes and posts the APK at:
# https://github.com/typro427/crew-hours/releases/download/billables-latest/BillsBillables.apk
name: Bill's Billables APK
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build the APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Post it for download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk BillsBillables.apk
          gh release delete billables-latest --yes --cleanup-tag || true
          gh release create billables-latest BillsBillables.apk --latest=false \
            --title "Bill's Billables (Android)" \
            --notes "Build ${GITHUB_RUN_NUMBER}. On the Android phone, open this page, tap BillsBillables.apk, then Install (allow installing from the browser if asked)."
