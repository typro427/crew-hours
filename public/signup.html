<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/app.css">
<title>Start your free trial · Crew Hours</title></head>
<body><main class="narrow">
  <a class="logo" href="/"><span>Crew</span>Hours</a>
  <form class="card" style="margin-top:24px" data-endpoint="/api/signup" data-next="/admin#welcome" novalidate>
    <div><h2>Start your free trial</h2><p class="muted" style="margin-top:6px">14 days free. No card needed to start.</p></div>
    <div><label for="company">Company name</label><input id="company" name="company" required maxlength="80" autocomplete="organization"></div>
    <div><label for="name">Your name</label><input id="name" name="name" required maxlength="80" autocomplete="name"></div>
    <div><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div>
    <div><label for="password">Password <span class="hint">8+ characters, 1 capital, 1 special (like !)</span></label><input id="password" name="password" type="password" required minlength="8" autocomplete="new-password"></div>
    <input type="hidden" name="timezone" id="timezone">
    <p class="hint">By signing up you agree to the <a href="/terms">terms</a> and <a href="/privacy">privacy policy</a>.</p>
    <button class="btn" type="submit">Create my account</button>
    <div class="status" role="status"></div>
    <p class="muted">Already have an account? <a href="/login">Log in</a></p>
  </form>
</main><script src="/site.js"></script></body></html>
