<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/app.css">
<title>Log in · Crew Hours</title></head>
<body><main class="narrow">
  <a class="logo" href="/"><span>Crew</span>Hours</a>
  <form class="card" style="margin-top:24px" data-endpoint="/api/login" data-next="/admin" novalidate>
    <div><h2>Boss log in</h2><p class="muted" style="margin-top:6px">Crew members: use the link and PIN your boss sent you.</p></div>
    <div><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div>
    <div><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password"></div>
    <button class="btn" type="submit">Log in</button>
    <div class="status" role="status"></div>
    <p class="muted"><a href="/forgot">Forgot your password?</a> · <a href="/signup">Start a free trial</a></p>
  </form>
</main><script src="/site.js"></script></body></html>
